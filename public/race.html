document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

72d0-4bb1-890d-bd7bcb09f33d\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Teko';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2074abf7-6327-426e-b6a0-c7d2a51ed9d4\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/*\n  Fonts as actually used in the source deck (ppt/theme + slide runs):\n  - Headlines / big numbers / stat figures: \"Teko\" — a condensed display face,\n    used ALL-CAPS-feeling at large sizes (36–48pt) in dark grey. Teko is a\n    genuine Google Font, loaded here with no substitution needed.\n  - Body copy / labels: theme minor font \"Calibri\". Calibri itself is a\n    licensed Microsoft font with no webfont files supplied in the source.\n    SUBSTITUTION FLAG: using \"Carlito\", Google's free metric-compatible match\n    for Calibri (identical widths/kerning), as the nearest available stand-in.\n    If real Calibri webfont files become available, drop them into\n    assets/fonts/ and repoint --font-body below.\n*/\n\n:root {\n  --font-display: 'Teko', 'Arial Narrow', sans-serif;\n  --font-body: 'Carlito', 'Calibri', Arial, sans-serif;\n\n  /* Type scale — Teko display / Carlito body, generous for large-format (slides, hero) use */\n  --text-display-1: 600 80px/1.0 var(--font-display);\n  --text-display-2: 600 64px/1.0 var(--font-display);\n  --text-h1: 600 48px/1.05 var(--font-display);\n  --text-h2: 600 36px/1.1 var(--font-display);\n  --text-h3: 600 28px/1.15 var(--font-body);\n  --text-body-lg: 400 19px/1.5 var(--font-body);\n  --text-body: 400 16px/1.55 var(--font-body);\n  --text-small: 400 14px/1.5 var(--font-body);\n  --text-caption: 400 12px/1.4 var(--font-body);\n  --text-label: 700 13px/1.2 var(--font-body);\n\n  --tracking-label: 0.06em;\n  --tracking-display: 0.01em;\n}\n\n:root {\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n  --space-10: 128px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 8px;\n  --radius-pill: 999px;\n\n  --shadow-sm: 0 1px 3px rgba(26,26,26,0.08);\n  --shadow-md: 0 4px 16px rgba(26,26,26,0.10);\n  --shadow-lg: 0 12px 32px rgba(26,26,26,0.14);\n\n  --container-max: 1200px;\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-base: 200ms; /* @kind other */\n}\n\n<\u002Fstyle>\n<script src=\"d29c0998-c801-40b2-a281-7648bcd9ddb3\"><\u002Fscript>\n<style>\nhtml,body{margin:0;background:#fff;font-family:var(--font-body)}\na{color:#00649C;text-decoration:none}a:hover{color:#004b76}\ninput,select,button{font-family:var(--font-body)}\n@keyframes vk-flash{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}\n@keyframes vk-pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"min-height:100dvh;display:flex;flex-direction:column;box-sizing:border-box\">\n\n  <div style=\"display:flex;height:6px;flex:none\">\n    <div style=\"flex:1;background:#8BB31D\"><\u002Fdiv>\n    <div style=\"flex:1;background:#72777A\"><\u002Fdiv>\n    <div style=\"flex:1;background:#00649C\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isSetup }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"flex:1;display:flex;align-items:flex-start;justify-content:center;padding:26px 32px\">\n      <div style=\"width:100%;max-width:760px\">\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:8px\">\n          <div>\n            <div style=\"font:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:#8BB31D;margin-bottom:2px\">UAS Technikum Wien · Projector view<\u002Fdiv>\n            <div style=\"font:600 44px/1 var(--font-display);color:#72777A\">VOCABULARY RACE<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ openLobby }}\" style=\"border:2px solid #6d8f16;background:#8BB31D;color:#fff;font:600 24px/1 var(--font-display);padding:0 30px;min-height:60px;border-radius:var(--radius-md);cursor:pointer;flex:none\">{{ openLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"font:var(--text-body);color:var(--text-secondary);margin:0 0 24px;max-width:60ch;text-wrap:pretty\">Students join with a code, you assign groups with one press, and the race starts for everyone at the same moment. Keep this window open — it is the referee, and the English answers never leave it.<\u002Fp>\n\n        <div style=\"font:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:#72777A;margin-bottom:8px\">Race type<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:24px\">\n          <sc-for list=\"{{ modeOptions }}\" as=\"m\" hint-placeholder-count=\"2\">\n            <button sc-camel-on-click=\"{{ m.onClick }}\" style=\"text-align:left;border:2px solid {{ m.border }};background:{{ m.bg }};padding:15px 18px;border-radius:var(--radius-md);cursor:pointer;min-height:64px\">\n              <span style=\"display:block;font:600 22px/1 var(--font-display);color:{{ m.fg }};margin-bottom:5px\">{{ m.title }}<\u002Fspan>\n              <span style=\"display:block;font:var(--text-small);color:{{ m.noteFg }};text-wrap:pretty\">{{ m.note }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showBlindChoice }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <div style=\"font:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:#72777A;margin-bottom:8px\">Do they know their team?<\u002Fdiv>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px\">\n              <sc-for list=\"{{ blindOptions }}\" as=\"b\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ b.onClick }}\" style=\"flex:1;min-width:220px;text-align:left;border:2px solid {{ b.border }};background:{{ b.bg }};padding:14px 16px;border-radius:var(--radius-md);cursor:pointer;min-height:60px\">\n                  <span style=\"display:block;font:600 20px/1 var(--font-display);color:{{ b.fg }};margin-bottom:4px\">{{ b.title }}<\u002Fspan>\n                  <span style=\"display:block;font:var(--text-small);color:{{ b.noteFg }};text-wrap:pretty\">{{ b.note }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"font:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:#72777A;margin-bottom:8px\">Degree programme<\u002Fdiv>\n        <sc-raw-select value=\"{{ programme }}\" sc-camel-on-change=\"{{ onProgramme }}\" style=\"width:100%;box-sizing:border-box;padding:14px 12px;font:500 17px var(--font-body);color:var(--color-grey-900);border:1.5px solid var(--border-strong);border-radius:var(--radius-md);background:#fff;margin-bottom:22px\">\n          <sc-for list=\"{{ programmeOptions }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <option value=\"{{ p.value }}\">{{ p.label }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n\n        <div style=\"display:flex;gap:36px;flex-wrap:wrap;margin-bottom:24px\">\n          <div>\n            <div style=\"font:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:#72777A;margin-bottom:8px\">Semester<\u002Fdiv>\n            <div style=\"display:flex;gap:8px\">\n              <sc-for list=\"{{ semesterOptions }}\" as=\"sm\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ sm.onClick }}\" style=\"border:1.5px solid {{ sm.border }};background:{{ sm.bg }};color:{{ sm.fg }};font:700 15px var(--font-body);padding:12px 18px;border-radius:var(--radius-md);cursor:pointer;min-height:46px\">{{ sm.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:#72777A;margin-bottom:8px\">Week<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <sc-for list=\"{{ weekOptions }}\" as=\"wk\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ wk.onClick }}\" style=\"border:1.5px solid {{ wk.border }};background:{{ wk.bg }};color:{{ wk.fg }};font:700 15px var(--font-body);padding:12px 18px;border-radius:var(--radius-md);cursor:pointer;min-height:46px\">{{ wk.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:#72777A;margin-bottom:8px\">Goal<\u002Fdiv>\n            <div style=\"display:flex;gap:8px\">\n              <sc-for list=\"{{ goalOptions }}\" as=\"go\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ go.onClick }}\" style=\"border:1.5px solid {{ go.border }};background:{{ go.bg }};color:{{ go.fg }};font:700 15px var(--font-body);padding:12px 18px;border-radius:var(--radius-md);cursor:pointer;min-height:46px\">{{ go.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font:var(--text-small);color:var(--text-secondary)\">{{ setupNote }}<\u002Fdiv>\n\n        <sc-if value=\"{{ setupError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:18px;padding:16px 18px;background:var(--color-blue-50);border:1.5px solid #00649C;border-radius:var(--radius-md);font:var(--text-small);color:var(--color-grey-900)\">{{ setupError }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isLobby }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column;padding:26px 34px 18px;box-sizing:border-box\">\n      <div style=\"display:flex;align-items:flex-end;gap:40px;flex-wrap:wrap;margin-bottom:22px\">\n        <div>\n          <div style=\"font:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:#8BB31D;margin-bottom:2px\">Open {{ joinHost }} and enter<\u002Fdiv>\n          <div style=\"font:600 104px/.88 var(--font-display);color:#72777A;letter-spacing:.05em\">{{ code }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:220px\">\n          <div style=\"font:600 30px/1 var(--font-display);color:#8BB31D;margin-bottom:6px\">{{ lobbyCount }}<\u002Fdiv>\n          <div style=\"font:var(--text-small);color:var(--text-secondary)\">{{ splitLabel }}<\u002Fdiv>\n          <div style=\"font:var(--text-small);color:var(--text-secondary)\">{{ modeLabel }} · first to {{ goal }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ startRace }}\" style=\"border:2px solid {{ goBorder }};background:{{ goBg }};color:{{ goFg }};font:600 40px/1 var(--font-display);padding:0 46px;min-height:92px;border-radius:var(--radius-md);cursor:{{ goCursor }};flex:none\">{{ goLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ setupError }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-bottom:16px;padding:14px 16px;background:var(--color-blue-50);border:1.5px solid #00649C;border-radius:var(--radius-md);font:var(--text-small);color:var(--color-grey-900)\">{{ setupError }}<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"flex:1;border-top:1px solid var(--border-default);padding-top:18px\">\n        <div style=\"font:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:#72777A;margin-bottom:14px\">In the room<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n          <sc-for list=\"{{ lobbyNames }}\" as=\"n\" hint-placeholder-count=\"6\">\n            <span style=\"font:600 22px/1 var(--font-display);color:#72777A;border:1.5px solid var(--border-strong);border-radius:var(--radius-md);padding:12px 16px;animation:vk-pop .2s ease\">{{ n.name }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ lobbyEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font:var(--text-body);color:var(--text-secondary)\">Nobody yet — students open the address above, tap CLASS RACE, and type the code.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:14px;border-top:1px solid var(--border-default);flex-wrap:wrap\">\n        <span style=\"font:var(--text-small);color:var(--text-secondary)\">{{ scopeLabel }}<\u002Fspan>\n        <button sc-camel-on-click=\"{{ backToSetup }}\" style=\"border:1.5px solid var(--border-strong);background:#fff;color:#72777A;font:600 17px/1 var(--font-display);padding:0 20px;min-height:46px;border-radius:var(--radius-md);cursor:pointer\">CANCEL<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isRunning }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column;padding:22px 30px 16px;box-sizing:border-box\">\n      <div style=\"display:flex;align-items:flex-end;gap:30px;flex-wrap:wrap;margin-bottom:18px\">\n        <div>\n          <div style=\"font:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:#8BB31D;margin-bottom:2px\">Code<\u002Fdiv>\n          <div style=\"font:600 52px/.9 var(--font-display);color:#72777A;letter-spacing:.04em\">{{ code }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:200px\">\n          <div style=\"font:var(--text-small);color:var(--text-secondary)\">{{ scopeLabel }}<\u002Fdiv>\n          <div style=\"font:var(--text-small);color:var(--text-secondary)\">{{ modeLabel }} · {{ playerLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:right\">\n          <div style=\"font:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:#72777A;margin-bottom:2px\">First to<\u002Fdiv>\n          <div style=\"font:600 50px/.9 var(--font-display);color:#8BB31D\">{{ goal }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:16px;align-items:stretch\">\n        <sc-for list=\"{{ groupCards }}\" as=\"g\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;flex-direction:column;border:2px solid {{ g.border }};border-radius:var(--radius-md);overflow:hidden;background:#fff;animation:{{ g.anim }}\">\n            <div style=\"padding:12px 14px;background:{{ g.headBg }};color:#fff\">\n              <div style=\"font:600 26px/1 var(--font-display)\">{{ g.name }}<\u002Fdiv>\n              <div style=\"font:var(--text-caption);opacity:.92;margin-top:3px;text-wrap:pretty\">{{ g.members }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:14px\">\n              <div style=\"font:600 clamp(52px, 6.5vw, 116px)/.85 var(--font-display);color:{{ g.pointsFg }};text-align:center;margin-bottom:12px\">{{ g.points }}<\u002Fdiv>\n              <div style=\"height:12px;background:var(--color-grey-100);border-radius:6px;overflow:hidden\">\n                <div style=\"height:100%;width:{{ g.pct }};background:{{ g.headBg }};transition:width .3s ease\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font:var(--text-caption);color:var(--text-secondary);text-align:center;margin-top:9px;min-height:18px\">{{ g.note }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border-default);flex-wrap:wrap\">\n        <span style=\"font:var(--text-small);color:var(--text-secondary)\">{{ feedLine }}<\u002Fspan>\n        <div style=\"display:flex;gap:10px\">\n          <button sc-camel-on-click=\"{{ toggleNames }}\" style=\"border:1.5px solid var(--border-strong);background:{{ namesBg }};color:{{ namesFg }};font:600 17px/1 var(--font-display);padding:0 20px;min-height:46px;border-radius:var(--radius-md);cursor:pointer\">{{ namesLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ resetPoints }}\" style=\"border:1.5px solid var(--border-strong);background:#fff;color:#72777A;font:600 17px/1 var(--font-display);padding:0 20px;min-height:46px;border-radius:var(--radius-md);cursor:pointer\">RESET SCORES<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ endRace }}\" style=\"border:1.5px solid #00649C;background:#fff;color:#00649C;font:600 17px/1 var(--font-display);padding:0 20px;min-height:46px;border-radius:var(--radius-md);cursor:pointer\">END RACE<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isFinished }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 32px;text-align:center;animation:vk-pop .25s ease\">\n      <div style=\"font:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:#8BB31D;margin-bottom:10px\">Race finished<\u002Fdiv>\n      <div style=\"font:600 clamp(64px, 11vw, 160px)/.9 var(--font-display);color:#72777A;margin-bottom:8px\">{{ winnerName }}<\u002Fdiv>\n      <div style=\"font:var(--text-body);color:var(--text-secondary);margin-bottom:34px\">{{ winnerNote }}<\u002Fdiv>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;justify-content:center\">\n        <button sc-camel-on-click=\"{{ againSameGroups }}\" style=\"border:none;background:#8BB31D;color:#fff;font:600 22px/1 var(--font-display);padding:0 28px;min-height:58px;border-radius:var(--radius-md);cursor:pointer\">SAME GROUPS, RACE AGAIN<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ backToSetup }}\" style=\"border:1.5px solid var(--border-strong);background:#fff;color:#72777A;font:600 22px/1 var(--font-display);padding:0 28px;min-height:58px;border-radius:var(--radius-md);cursor:pointer\">NEW RACE<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"padding:10px 30px;border-top:1px solid var(--border-default);font:var(--text-caption);color:var(--text-secondary);display:flex;justify-content:space-between\">\n    <span>UAS Technikum Wien<\u002Fspan>\n    <span>{{ statusLabel }}<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;deckUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;decks/vocab.csv&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Data&quot;},&quot;joinUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;vocabtrainer-c1499.web.app&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Race&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    phase: 'setup', status: 'Loading vocabulary…',\n    vocab: [], programme: '', semester: 1, week: 'all',\n    goal: 12, mode: 'type', blind: false,\n    code: '', groups: [], players: [], feed: '', setupError: '', busy: false,\n    winner: null, flash: {}, showNames: false\n  };\n\n  NAMES = ['ALPHA', 'BETA', 'GAMMA', 'DELTA', 'EPSILON', 'ZETA', 'ETA', 'THETA'];\n  COLORS = ['#8BB31D', '#00649C', '#72777A', '#5c7712', '#004b76', '#4f5457', '#a7c93f', '#2b7fb0'];\n\n  get deckUrl() { return this.props.deckUrl || 'decks/vocab.csv'; }\n  get joinHost() { return this.props.joinUrl || 'vocabtrainer-c1499.web.app'; }\n\n  componentDidMount() {\n    this.answers = {};   // wordKey -> english answer (never written to Firestore)\n    this.words = [];     // [{ k, def, en }]\n    this.queues = {};    // groupId -> { ids, i }\n    this.seen = {};      // uid -> last judged answer timestamp\n    this.unsub = [];\n    fetch(this.deckUrl, { cache: 'no-store' })\n      .then(r => r.ok ? r.text() : Promise.reject(r.status))\n      .then(t => {\n        const rows = this.parseCSV(t);\n        const progs = this.programmesIn(rows);\n        const prog = progs[0] || '';\n        const sems = this.semestersIn(rows, prog);\n        this.setState({ vocab: rows, programme: prog, semester: sems[0] || 1, status: 'Ready' });\n      })\n      .catch(() => this.setState({ status: 'Vocabulary file could not be loaded', setupError: 'The deck file ' + this.deckUrl + ' could not be read, so there is nothing to race with.' }));\n  }\n  componentWillUnmount() { this.unsub.forEach(f => { try { f(); } catch (e) {} }); }\n\n  // ---------- CSV ----------\n  splitLine(line) {\n    const out = []; let cur = ''; let q = false;\n    for (let i = 0; i < line.length; i++) {\n      const ch = line[i];\n      if (ch === '\"') { if (q && line[i + 1] === '\"') { cur += '\"'; i++; } else q = !q; }\n      else if (ch === ',' && !q) { out.push(cur); cur = ''; }\n      else cur += ch;\n    }\n    out.push(cur);\n    return out.map(x => x.trim());\n  }\n  parseCSV(text) {\n    const lines = String(text).split(/\\r?\\n/).filter(l => l.trim().length);\n    if (!lines.length) return [];\n    const head = this.splitLine(lines[0]).map(h => h.toLowerCase());\n    const idx = names => { for (const n of names) { const i = head.indexOf(n); if (i > -1) return i; } return -1; };\n    const iEn = idx(['english', 'word', 'term', 'en']);\n    const iDe = idx(['german', 'deutsch', 'de']);\n    const iDef = idx(['definition', 'def', 'meaning']);\n    const iWk = idx(['week', 'woche']);\n    const iSem = idx(['semester', 'sem', 'term']);\n    const iPr = idx(['programme', 'program', 'studiengang', 'course']);\n    if (iEn < 0 || iDef < 0) return [];\n    const rows = [];\n    for (let i = 1; i < lines.length; i++) {\n      const c = this.splitLine(lines[i]);\n      if (!c[iEn]) continue;\n      const prog = (iPr > -1 && c[iPr]) ? c[iPr] : 'General';\n      const sem = iSem > -1 ? (parseInt(c[iSem], 10) || 1) : 1;\n      const wk = iWk > -1 ? (parseInt(c[iWk], 10) || 1) : 1;\n      rows.push({\n        id: prog.slice(0, 3) + '-' + sem + '-' + wk + '-' + c[iEn],\n        en: c[iEn], de: iDe > -1 ? (c[iDe] || '') : '', def: c[iDef] || '',\n        semester: sem, week: wk, programme: prog\n      });\n    }\n    return rows;\n  }\n\n  // ---------- helpers ----------\n  shuffle(a) { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = x[i]; x[i] = x[j]; x[j] = t; } return x; }\n  norm(s) { return String(s || '').toLowerCase().trim().replace(/^(the|a|an|to|der|die|das)\\s+/, '').replace(/[.,;!?]/g, '').replace(/\\s+/g, ' '); }\n  programmesIn(rows) { const o = {}; rows.forEach(v => o[v.programme] = 1); return Object.keys(o).sort(); }\n  semestersIn(rows, prog) { const o = {}; rows.forEach(v => { if (v.programme === prog) o[v.semester] = 1; }); return Object.keys(o).map(Number).sort((a, b) => a - b); }\n  weeksIn(rows, prog, sem) { const o = {}; rows.forEach(v => { if (v.programme === prog && v.semester === sem) o[v.week] = 1; }); return Object.keys(o).map(Number).sort((a, b) => a - b); }\n  deck(s) {\n    s = s || this.state;\n    return s.vocab.filter(v => v.programme === s.programme && v.semester === s.semester && (s.week === 'all' || v.week === s.week));\n  }\n  chip(active) {\n    return active\n      ? { border: '#6d8f16', bg: '#8BB31D', fg: '#fff' }\n      : { border: 'var(--border-strong, #c9cccd)', bg: '#fff', fg: '#72777A' };\n  }\n  onProgramme = e => {\n    const p = e.target.value;\n    this.setState(s => {\n      const sems = this.semestersIn(s.vocab, p);\n      return { programme: p, semester: sems[0] || 1, week: 'all' };\n    });\n  };\n\n  // Group sizes: 3 per group, the remainder spread as groups of 4.\n  splitSizes(n) {\n    if (n < 4) return n > 0 ? [n] : [];   // testing / very small class: one group\n    let g = Math.max(2, Math.floor(n / 3));\n    if (g > n) g = n;\n    while (n / g > 4) g++;\n    const base = Math.floor(n / g), extra = n % g;\n    const sizes = [];\n    for (let i = 0; i < g; i++) sizes.push(base + (i < extra ? 1 : 0));\n    return sizes.sort((a, b) => b - a);\n  }\n\n  // Only the pick-from-five race can be run blind.\n  isBlind() { return this.state.mode === 'pick' && this.state.blind; }\n\n  nextId(gid) {\n    const q = this.queues[gid];\n    if (!q || !q.ids.length) return '';\n    const id = q.ids[q.i % q.ids.length];\n    q.i++;\n    return id;\n  }\n\n  // ---------- lobby ----------\n  openLobby = async () => {\n    const deck = this.deck();\n    if (deck.length < 6) { this.setState({ setupError: 'This scope has fewer than six words — pick a wider week or semester.' }); return; }\n    this.setState({ busy: true, setupError: '', status: 'Loading race module…' });\n    try {\n      const url = new URL('race-net.js', document.baseURI).href;\n      const net = await import(/* @vite-ignore */ url);\n      this.setState({ status: 'Signing in…' });\n      await net.connect();\n      const code = net.newCode();\n      // Opaque word keys: the id must not reveal the English answer.\n      this.words = this.shuffle(deck).map((v, i) => ({ k: 'w' + i, def: v.def, en: v.en }));\n      this.answers = {};\n      const defs = {};\n      this.words.forEach(w => { defs[w.k] = w.def; this.answers[w.k] = w.en; });\n      this.setState({ status: 'Opening lobby…' });\n      await net.createSession(code, {\n        state: 'lobby', mode: this.state.mode, blind: this.isBlind(), goal: this.state.goal,\n        scope: { programme: this.state.programme, semester: this.state.semester, week: this.state.week },\n        defs: defs, groups: []\n      });\n      this.net = net;\n      this.seen = {};\n      this.setState({ code: code, phase: 'lobby', busy: false, status: 'Lobby open', players: [], groups: [], winner: null, feed: '' });\n      this.unsub.push(await net.watchPlayers(code, ps => { if (ps) { this.setState({ players: ps }); this.judge(ps); } }));\n      this.unsub.push(await net.watchGroups(code, gs => { if (gs) this.setState({ groups: gs.slice().sort((a, b) => a.id.localeCompare(b.id)) }); }));\n    } catch (e) {\n      const msg = (e && (e.code || e.message)) ? (e.code ? e.code + ' — ' : '') + (e.message || '') : String(e);\n      this.setState({ busy: false, status: 'Could not open lobby', setupError: 'Failed: ' + msg });\n    }\n  };\n\n  // ---------- start (teacher presses GO) ----------\n  startRace = async () => {\n    const s = this.state;\n    if (s.phase !== 'lobby') { this.setState({ setupError: 'Not in a lobby.' }); return; }\n    if (s.busy) return;\n    if (s.players.length < 1) { this.setState({ setupError: 'No phones have joined yet.' }); return; }\n    this.setState({ busy: true, setupError: '', status: 'Assigning groups…' });\n    try {\n      const shuffled = this.shuffle(s.players);\n      const sizes = this.splitSizes(shuffled.length);\n      let at = 0;\n      const groups = [];\n      for (let i = 0; i < sizes.length; i++) {\n        const members = shuffled.slice(at, at + sizes[i]);\n        at += sizes[i];\n        const gid = 'g' + (i + 1);\n        this.queues[gid] = { ids: this.shuffle(this.words).map(w => w.k), i: 0 };\n        const wordId = this.nextId(gid);\n        groups.push({ gid: gid, members: members, wordId: wordId });\n        // Blind round: names are never written to Firestore, so a phone cannot\n        // discover its teammates at all. Team round publishes them.\n        const doc = {\n          name: 'GROUP ' + this.NAMES[i % this.NAMES.length],\n          points: 0, status: 'ready', currentWordId: wordId,\n          members: members.map(p => p.uid),\n          answeredAt: Date.now()\n        };\n        if (!this.isBlind()) doc.memberNames = members.map(p => p.firstName || '—');\n        await this.net.putGroup(s.code, gid, doc);\n        // Tell each phone its own group, so it can listen to ONE group document\n        // instead of the whole collection (that is what keeps reads low).\n        for (const p of members) {\n          try { await this.net.setPlayer(s.code, p.uid, { groupId: gid }); } catch (e) {}\n        }\n      }\n      if (s.mode === 'pick') {\n        for (const g of groups) await this.dealOptions(g.gid, g.members.map(p => p.uid), g.wordId);\n      }\n      await this.net.setSession(s.code, { state: 'running' });\n      this.setState({ phase: 'running', busy: false, status: 'Live', showNames: !this.isBlind(), feed: sizes.length + ' groups · go' });\n    } catch (e) {\n      const msg = (e && (e.code || e.message)) ? (e.code ? e.code + ' — ' : '') + (e.message || '') : String(e);\n      console.error('startRace failed', e);\n      this.setState({ busy: false, status: 'Could not start', setupError: 'GO failed: ' + msg, phase: 'lobby' });\n    }\n  };\n\n  // In pick mode exactly one phone in the group holds the correct answer.\n  async dealOptions(gid, uids, wordId) {\n    if (!uids.length) return;\n    const correct = this.answers[wordId] || '';\n    const pool = this.words.map(w => w.en).filter(en => this.norm(en) !== this.norm(correct));\n    const holder = Math.floor(Math.random() * uids.length);\n    for (let i = 0; i < uids.length; i++) {\n      const picks = this.shuffle(pool).slice(0, i === holder ? 4 : 5);\n      const opts = i === holder ? this.shuffle(picks.concat([correct])) : picks;\n      try { await this.net.setPlayer(this.state.code, uids[i], { words: opts, currentWordId: wordId }); } catch (e) {}\n    }\n  }\n\n  groupUids(group) { return (group && group.members) || []; }\n\n  async judge(players) {\n    if (this.state.phase !== 'running') return;\n    for (const p of players) {\n      const a = p.lastAnswer;\n      if (!a || a.verdict !== 'pending') continue;\n      if (this.seen[p.uid] === a.at) continue;\n      this.seen[p.uid] = a.at;\n      const group = this.state.groups.find(g => this.groupUids(g).indexOf(p.uid) > -1);\n      if (!group) continue;\n      if (a.wordId !== group.currentWordId) continue;   // stale answer\n      const ok = this.norm(a.text) === this.norm(this.answers[a.wordId] || '');\n      const points = ok ? group.points + 1 : 0;\n      const won = ok && points >= this.state.goal;\n      const nextWord = won ? group.currentWordId : this.nextId(group.id);\n      try {\n        await this.net.setPlayerVerdict(this.state.code, p.uid, Object.assign({}, a, {\n          verdict: ok ? 'right' : 'wrong', answer: this.answers[a.wordId] || ''\n        }));\n        await this.net.setGroup(this.state.code, group.id, {\n          points: points, currentWordId: nextWord,\n          status: won ? 'won' : (ok ? 'right' : 'wrong'), answeredAt: Date.now()\n        });\n        if (!won && this.state.mode === 'pick') await this.dealOptions(group.id, this.groupUids(group), nextWord);\n      } catch (e) { /* two phones answered at once — ignore the loser */ }\n      this.flash(group.id, ok);\n      this.setState({\n        feed: (p.firstName || 'Someone') + ' · ' + group.name + ' · ' + (ok ? '“' + a.text + '” correct' : '“' + a.text + '” wrong, back to zero')\n      });\n      if (won) {\n        try { await this.net.finishSession(this.state.code, group.name); } catch (e) {}\n        this.setState({ phase: 'finished', winner: group.name, status: 'Finished' });\n        return;\n      }\n    }\n  }\n\n  flash(gid, ok) {\n    this.setState(s => ({ flash: Object.assign({}, s.flash, { [gid]: ok ? 'right' : 'wrong' }) }));\n    clearTimeout(this['ft' + gid]);\n    this['ft' + gid] = setTimeout(() => this.setState(s => {\n      const f = Object.assign({}, s.flash); delete f[gid]; return { flash: f };\n    }), 700);\n  }\n\n  toggleNames = () => this.setState(s => ({ showNames: !s.showNames }));\n\n  resetPoints = async () => {\n    if (!this.net) return;\n    for (const g of this.state.groups) {\n      const wordId = this.nextId(g.id);\n      try {\n        await this.net.setGroup(this.state.code, g.id, { points: 0, status: 'ready', currentWordId: wordId, answeredAt: Date.now() });\n        if (this.state.mode === 'pick') await this.dealOptions(g.id, this.groupUids(g), wordId);\n      } catch (e) {}\n    }\n    this.setState({ feed: 'Scores reset' });\n  };\n\n  endRace = async () => {\n    if (this.net) { try { await this.net.finishSession(this.state.code, ''); } catch (e) {} }\n    const lead = this.state.groups.slice().sort((a, b) => b.points - a.points)[0];\n    this.setState({ phase: 'finished', winner: lead ? lead.name : '', status: 'Finished' });\n  };\n\n  againSameGroups = async () => {\n    if (!this.net) return;\n    this.setState({ phase: 'running', winner: null, status: 'Live', feed: 'New round, same groups' });\n    try { await this.net.setSession(this.state.code, { state: 'running', winner: '' }); } catch (e) {}\n    for (const g of this.state.groups) {\n      const wordId = this.nextId(g.id);\n      try {\n        await this.net.setGroup(this.state.code, g.id, { points: 0, status: 'ready', currentWordId: wordId, answeredAt: Date.now() });\n        if (this.state.mode === 'pick') await this.dealOptions(g.id, this.groupUids(g), wordId);\n      } catch (e) {}\n    }\n  };\n\n  backToSetup = async () => {\n    this.unsub.forEach(f => { try { f(); } catch (e) {} });\n    this.unsub = [];\n    if (this.net && this.state.code) { try { await this.net.closeSession(this.state.code); } catch (e) {} }\n    this.seen = {};\n    this.setState({ phase: 'setup', code: '', groups: [], players: [], winner: null, feed: '', status: 'Ready', showNames: false });\n  };\n\n  renderVals() {\n    const s = this.state;\n    const deck = this.deck();\n    const sems = this.semestersIn(s.vocab, s.programme);\n    const weeks = this.weeksIn(s.vocab, s.programme, s.semester);\n    const sizes = this.splitSizes(s.players.length);\n    const canGo = s.players.length >= 1 && !s.busy;\n\n    const byUid = {};\n    s.players.forEach(p => { byUid[p.uid] = p.firstName || '—'; });\n\n    const groupCards = s.groups.map((g, i) => {\n      const fl = s.flash[g.id];\n      const names = (g.members || []).map(u => byUid[u] || '—');\n      return {\n        name: g.name,\n        members: s.showNames ? names.join(' · ') : (names.length === 1 ? '1 player' : names.length + ' players'),\n        points: g.points,\n        pct: Math.min(100, Math.round((g.points / Math.max(1, s.goal)) * 100)) + '%',\n        headBg: this.COLORS[i % this.COLORS.length],\n        border: fl === 'right' ? '#8BB31D' : fl === 'wrong' ? '#00649C' : 'var(--border-default, #e3e5e5)',\n        pointsFg: fl === 'wrong' ? '#00649C' : '#72777A',\n        anim: fl ? 'vk-flash .5s ease' : 'none',\n        note: g.status === 'wrong' ? 'back to zero' : g.status === 'right' ? 'correct' : g.status === 'won' ? 'winner' : 'racing'\n      };\n    });\n\n    return {\n      isSetup: s.phase === 'setup', isLobby: s.phase === 'lobby',\n      isRunning: s.phase === 'running', isFinished: s.phase === 'finished',\n      statusLabel: s.status,\n\n      modeOptions: [\n        Object.assign({\n          title: 'TYPE THE WORD', note: 'A definition appears on every phone in the group. Anyone can type the English word — first correct answer scores.',\n          onClick: () => this.setState({ mode: 'type' })\n        }, s.mode === 'type' ? { border: '#6d8f16', bg: '#8BB31D', fg: '#fff', noteFg: 'rgba(255,255,255,.92)' } : { border: 'var(--border-strong, #c9cccd)', bg: '#fff', fg: '#72777A', noteFg: 'var(--text-secondary)' }),\n        Object.assign({\n          title: 'PICK FROM FIVE', note: 'Each phone gets five different words and only one phone in the group holds the right one — the group has to work out who has it.',\n          onClick: () => this.setState({ mode: 'pick' })\n        }, s.mode === 'pick' ? { border: '#6d8f16', bg: '#8BB31D', fg: '#fff', noteFg: 'rgba(255,255,255,.92)' } : { border: 'var(--border-strong, #c9cccd)', bg: '#fff', fg: '#72777A', noteFg: 'var(--text-secondary)' })\n      ],\n      showBlindChoice: s.mode === 'pick',\n      blindOptions: [\n        Object.assign({\n          title: 'TEAM', note: 'Group members are named on the projector and on their phones.',\n          onClick: () => this.setState({ blind: false })\n        }, !s.blind ? { border: '#6d8f16', bg: '#8BB31D', fg: '#fff', noteFg: 'rgba(255,255,255,.92)' } : { border: 'var(--border-strong, #c9cccd)', bg: '#fff', fg: '#72777A', noteFg: 'var(--text-secondary)' }),\n        Object.assign({\n          title: 'BLIND — HARD', note: 'Nobody is told who their teammates are. Reveal them later with SHOW NAMES if you want to.',\n          onClick: () => this.setState({ blind: true })\n        }, s.blind ? { border: '#6d8f16', bg: '#8BB31D', fg: '#fff', noteFg: 'rgba(255,255,255,.92)' } : { border: 'var(--border-strong, #c9cccd)', bg: '#fff', fg: '#72777A', noteFg: 'var(--text-secondary)' })\n      ],\n      openLabel: s.busy ? 'OPENING…' : 'OPEN LOBBY',\n      openLobby: this.openLobby,\n\n      programme: s.programme,\n      programmeOptions: this.programmesIn(s.vocab).map(p => ({ value: p, label: p })),\n      onProgramme: this.onProgramme,\n      semesterOptions: sems.map(n => Object.assign({ label: n + '. Sem', onClick: () => this.setState({ semester: n, week: 'all' }) }, this.chip(s.semester === n))),\n      weekOptions: [{ label: 'All', onClick: () => this.setState({ week: 'all' }) }]\n        .concat(weeks.map(w => ({ label: 'Week ' + w, onClick: () => this.setState({ week: w }) })))\n        .map((o, i) => Object.assign(o, this.chip(i === 0 ? s.week === 'all' : s.week === weeks[i - 1]))),\n      goalOptions: [8, 12, 16].map(n => Object.assign({ label: String(n), onClick: () => this.setState({ goal: n }) }, this.chip(s.goal === n))),\n      setupNote: deck.length ? deck.length + ' words in this scope · groups of three are formed automatically when you press GO' : 'No words in this scope',\n      setupError: s.setupError,\n\n      code: s.code,\n      joinHost: this.joinHost,\n      goal: s.goal,\n      modeLabel: s.mode === 'pick' ? (s.blind ? 'Pick from five · blind' : 'Pick from five · team') : 'Type the word',\n      scopeLabel: s.programme + ' · ' + s.semester + '. semester · ' + (s.week === 'all' ? 'all weeks' : 'week ' + s.week) + ' · ' + deck.length + ' words',\n      lobbyCount: s.players.length === 1 ? '1 student' : s.players.length + ' students',\n      splitLabel: s.players.length === 0 ? 'Waiting for the first phone'\n        : s.players.length < 4 ? 'One group of ' + s.players.length + ' — fine for testing'\n        : sizes.length + ' groups · ' + sizes.join(' + ') + ' players',\n      lobbyNames: this.shuffleNames(s.players),\n      lobbyEmpty: s.players.length === 0,\n      goLabel: s.busy ? '…' : 'GO',\n      goBg: canGo ? '#8BB31D' : 'var(--color-grey-100, #eceded)',\n      goFg: canGo ? '#fff' : 'var(--color-grey-300, #b6b9ba)',\n      goBorder: canGo ? '#6d8f16' : 'var(--border-strong, #c9cccd)',\n      goCursor: canGo ? 'pointer' : 'not-allowed',\n      startRace: this.startRace,\n\n      playerLabel: s.players.length + ' phones',\n      columnCount: Math.max(1, s.groups.length),\n      groupCards: groupCards,\n      feedLine: s.feed,\n      namesLabel: s.showNames ? 'HIDE NAMES' : 'SHOW NAMES',\n      namesBg: s.showNames ? '#8BB31D' : '#fff',\n      namesFg: s.showNames ? '#fff' : '#72777A',\n      toggleNames: this.toggleNames,\n      resetPoints: this.resetPoints,\n      endRace: this.endRace,\n\n      winnerName: s.winner || 'NO WINNER',\n      winnerNote: s.winner ? s.winner + ' reached the goal first.' : 'The race was ended early.',\n      againSameGroups: this.againSameGroups,\n      backToSetup: this.backToSetup\n    };\n  }\n\n  shuffleNames(players) {\n    return players.map(p => ({ name: p.firstName || '—' }));\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
